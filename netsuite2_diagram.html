<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NetSuite2 — Schema Diagram (interactive)</title>
    <style>
        :root {
            --bg: #1e1e1e;
            --panel: #252526;
            --border: #3c3c3c;
            --text: #d4d4d4;
            --accent: #0078d4;
            --accent-hover: #106ebe;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        header {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 48px;
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 16px;
            z-index: 10;
            gap: 12px;
        }

        header h1 {
            font-size: 14px;
            font-weight: 600;
            margin: 0;
            flex: 1;
        }

        .toolbar {
            display: flex;
            gap: 6px;
        }

        .toolbar button {
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 4px;
            padding: 6px 12px;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.15s;
            min-width: 36px;
        }

        .toolbar button:hover { background: var(--accent-hover); }
        .toolbar button:active { transform: translateY(1px); }

        #viewer {
            position: absolute;
            top: 48px;
            left: 0;
            right: 0;
            bottom: 24px;
            overflow: hidden;
            background: #ffffff;
            cursor: grab;
        }

        #viewer:active { cursor: grabbing; }

        #viewer svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        footer {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 24px;
            background: var(--panel);
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 16px;
            font-size: 11px;
            color: #888;
            z-index: 10;
        }

        footer .hint { flex: 1; }

        #loading {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #666;
            font-size: 14px;
        }

        #error {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #c00;
            font-size: 14px;
            text-align: center;
            max-width: 500px;
            padding: 20px;
            background: #fff5f5;
            border: 1px solid #fcc;
            border-radius: 6px;
            display: none;
        }
    </style>
</head>
<body>
    <header>
        <h1>🗂️ NetSuite2 — Schema Diagram</h1>
        <div class="toolbar">
            <button id="btn-zoom-in"   title="Zoom in (+)">➕</button>
            <button id="btn-zoom-out"  title="Zoom out (-)">➖</button>
            <button id="btn-fit"       title="Ajustar a pantalla (F)">⛶ Fit</button>
            <button id="btn-reset"     title="Restaurar vista (R)">↺ Reset</button>
            <button id="btn-download"  title="Descargar SVG">⬇ SVG</button>
        </div>
    </header>

    <div id="viewer">
        <div id="loading">Cargando diagrama…</div>
        <div id="error"></div>
    </div>

    <footer>
        <span class="hint">
            🖱️ Arrastra para desplazar &nbsp;|&nbsp;
            🔍 Rueda del ratón para zoom &nbsp;|&nbsp;
            ⌨️ Atajos: <b>+</b> / <b>−</b> / <b>F</b> (fit) / <b>R</b> (reset)
        </span>
        <span>svg-pan-zoom v3.6.1</span>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.1/dist/svg-pan-zoom.min.js"></script>
    <script>
        (function () {
            const SVG_URL = './netsuite2.svg';
            const viewer  = document.getElementById('viewer');
            const loading = document.getElementById('loading');
            const errorEl = document.getElementById('error');

            let panZoomInstance = null;

            function showError(msg) {
                loading.style.display = 'none';
                errorEl.style.display = 'block';
                errorEl.innerHTML = msg;
            }

            fetch(SVG_URL)
                .then(function (r) {
                    if (!r.ok) throw new Error('HTTP ' + r.status + ' al cargar ' + SVG_URL);
                    return r.text();
                })
                .then(function (svgText) {
                    loading.remove();

                    // Insertar SVG inline
                    viewer.insertAdjacentHTML('beforeend', svgText);
                    const svgEl = viewer.querySelector('svg');
                    if (!svgEl) throw new Error('El archivo cargado no contiene un elemento <svg>.');

                    // Asegurar que el SVG ocupa el contenedor
                    svgEl.setAttribute('width',  '100%');
                    svgEl.setAttribute('height', '100%');
                    svgEl.style.maxWidth  = 'none';
                    svgEl.style.maxHeight = 'none';

                    // Inicializar svg-pan-zoom
                    panZoomInstance = svgPanZoom(svgEl, {
                        zoomEnabled: true,
                        controlIconsEnabled: false,      // usamos nuestra propia toolbar
                        panEnabled: true,
                        fit: true,
                        center: true,
                        minZoom: 0.1,
                        maxZoom: 20,
                        zoomScaleSensitivity: 0.35,
                        dblClickZoomEnabled: true,
                        mouseWheelZoomEnabled: true,
                        preventMouseEventsDefault: true
                    });

                    // Toolbar
                    document.getElementById('btn-zoom-in') .addEventListener('click', function () { panZoomInstance.zoomIn(); });
                    document.getElementById('btn-zoom-out').addEventListener('click', function () { panZoomInstance.zoomOut(); });
                    document.getElementById('btn-fit')     .addEventListener('click', function () { panZoomInstance.fit(); panZoomInstance.center(); });
                    document.getElementById('btn-reset')   .addEventListener('click', function () { panZoomInstance.resetZoom(); panZoomInstance.resetPan(); });
                    document.getElementById('btn-download').addEventListener('click', function () {
                        const a = document.createElement('a');
                        a.href = SVG_URL;
                        a.download = 'netsuite2.svg';
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                    });

                    // Atajos de teclado
                    document.addEventListener('keydown', function (e) {
                        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
                        switch (e.key) {
                            case '+':
                            case '=':
                                panZoomInstance.zoomIn();  e.preventDefault(); break;
                            case '-':
                            case '_':
                                panZoomInstance.zoomOut(); e.preventDefault(); break;
                            case 'f':
                            case 'F':
                                panZoomInstance.fit(); panZoomInstance.center(); e.preventDefault(); break;
                            case 'r':
                            case 'R':
                                panZoomInstance.resetZoom(); panZoomInstance.resetPan(); e.preventDefault(); break;
                        }
                    });

                    // Reajustar en resize
                    window.addEventListener('resize', function () {
                        if (panZoomInstance) {
                            panZoomInstance.resize();
                            panZoomInstance.fit();
                            panZoomInstance.center();
                        }
                    });
                })
                .catch(function (err) {
                    showError(
                        '<b>No se pudo cargar el diagrama.</b><br><br>' +
                        'Motivo: ' + err.message + '<br><br>' +
                        'Si has abierto este archivo con doble clic (<code>file://</code>), ' +
                        'algunos navegadores bloquean <code>fetch()</code> por CORS.<br>' +
                        'Solución: sirve la carpeta con un servidor local, por ejemplo:<br>' +
                        '<code>python -m http.server 8000</code><br>' +
                        'y abre <code>http://localhost:8000/docs/netsuite2_diagram.html</code>'
                    );
                });
        })();
    </script>
</body>
</html>
